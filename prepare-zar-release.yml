name: ZAR Web — Validate and Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.zip"

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate and Package ZAR Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect ZAR version
        shell: bash
        run: |
          set -euo pipefail

          test -f VERSION || { echo "ERROR: VERSION not found."; exit 1; }

          ZAR_VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "$ZAR_VERSION" || { echo "ERROR: VERSION is empty."; exit 1; }

          echo "ZAR_VERSION=$ZAR_VERSION" >> "$GITHUB_ENV"
          echo "Detected ZAR version: $ZAR_VERSION"

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app
          find app -type d -name '__pycache__' -prune -exec rm -rf {} +
          find app -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          echo "Python syntax validation completed successfully."

      - name: Install HTML validation dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4

      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="/tmp/zar-scripts"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path

          html_path = Path("app/templates/index.html")
          if not html_path.exists():
              raise SystemExit("ERROR: app/templates/index.html not found.")

          soup = BeautifulSoup(html_path.read_text(encoding="utf-8"), "html.parser")
          scripts = soup.find_all("script")

          out = Path("/tmp/zar-scripts")
          inline_count = 0
          for i, script in enumerate(scripts):
              if script.get("src"):
                  continue
              content = script.string or script.get_text() or ""
              (out / f"script-{i}.js").write_text(content, encoding="utf-8")
              inline_count += 1

          print(f"Found {len(scripts)} script tags; extracted {inline_count} inline scripts.")
          if inline_count == 0:
              raise SystemExit("ERROR: No inline JavaScript blocks found.")
          PY

          shopt -s nullglob
          JS_FILES=("$TEST_DIR"/*.js)
          for file in "${JS_FILES[@]}"; do
            echo "Checking JavaScript syntax: $file"
            node --check "$file"
          done

          echo "HTML/JavaScript validation completed successfully."

      - name: Verify required ZAR files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "app"
            "app/main.py"
            "app/templates/index.html"
            "app/static"
            "requirements.txt"
            "Procfile"
            "VERSION"
            "VERSION.txt"
            ".github/workflows/prepare-zar-release.yml"
          )

          for path in "${required[@]}"; do
            test -e "$path" || { echo "ERROR: Missing $path"; exit 1; }
            echo "OK: $path"
          done

      - name: Verify version files
        shell: bash
        run: |
          set -euo pipefail

          test "$(tr -d '\r\n' < VERSION)" = "$ZAR_VERSION"
          test "$(tr -d '\r\n' < VERSION.txt)" = "$ZAR_VERSION"

          if [ -f app/VERSION.txt ]; then
            test "$(tr -d '\r\n' < app/VERSION.txt)" = "$ZAR_VERSION"
          fi

          echo "Version files are synchronized: $ZAR_VERSION"

      - name: Verify repository is clean
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f \( -name '*.zip' -o -name 'google_token.json' -o -name 'youtube_token.json' -o -name 'credentials.json' \) -not -path './.git/*' | grep -q .; then
            echo "ERROR: The repository contains a generated ZIP or credential/token file."
            find . -type f \( -name '*.zip' -o -name 'google_token.json' -o -name 'youtube_token.json' -o -name 'credentials.json' \) -not -path './.git/*'
            exit 1
          fi

          if find . -type d -name '__pycache__' -not -path './.git/*' | grep -q .; then
            echo "ERROR: __pycache__ directories must not be committed."
            find . -type d -name '__pycache__' -not -path './.git/*'
            exit 1
          fi

          echo "Repository cleanliness checks passed."

      - name: Remove generated Python caches
        shell: bash
        run: |
          find app -type d -name '__pycache__' -prune -exec rm -rf {} +
          find app -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Create clean release ZIP
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="/tmp/zar-release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          rsync -a \
            --exclude='.git/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='.DS_Store' \
            --exclude='*.zip' \
            ./ "$RELEASE_DIR/"

          cd "$RELEASE_DIR"

          ZIP_NAME="ZAR_web_v${ZAR_VERSION}_${GITHUB_SHA::7}.zip"
          zip -qr "$GITHUB_WORKSPACE/$ZIP_NAME" .

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          echo "Created: $ZIP_NAME"
          ls -lh "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Validate release ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ZIP_NAME"
          unzip -t "$ZIP_NAME"
          echo "ZIP integrity validation completed successfully."

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAR-web-release-v${{ env.ZAR_VERSION }}-${{ github.sha }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30
