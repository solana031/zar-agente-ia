name: ZAR - Actualizar desde ZIP

on:
  push:
    paths:
      - "*.zip"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo comprobar persistencia y protección, sin modificar el repositorio"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  update:
    name: Extraer ZIP y actualizar repositorio
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[zar-auto-update]') }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar modo de ejecución
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DRY_RUN=${{ inputs.dry_run }}" >> "$GITHUB_ENV"
          else
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          fi

          echo "Modo DRY_RUN configurado."

      - name: Comprobar protección del repositorio
        shell: bash
        run: |
          set -e

          echo "=== COMPROBACIÓN DE PERSISTENCIA ==="

          if [ ! -f ".github/workflows/zar-auto-update.yml" ]; then
            echo "ERROR: falta el workflow permanente."
            exit 1
          fi

          if [ ! -f ".gitignore" ]; then
            echo "ERROR: falta .gitignore."
            exit 1
          fi

          if [ ! -f "app/__init__.py" ]; then
            echo "ERROR: falta app/__init__.py."
            exit 1
          fi

          echo ""
          echo "=== COMPROBANDO .gitignore ==="

          for pattern in \
            "users/" \
            "backups/" \
            "jobs/" \
            "audio_studio/" \
            "video_creator/" \
            "*.sqlite3" \
            "*.sqlite" \
            "*.db"; do

            if grep -Fqx "$pattern" .gitignore; then
              echo "OK: $pattern"
            else
              echo "ERROR: falta protección para $pattern"
              exit 1
            fi
          done

          echo ""
          echo "=== COMPROBANDO app/__init__.py ==="

          if grep -q "RAILWAY_VOLUME_MOUNT_PATH" app/__init__.py; then
            echo "OK: app utiliza RAILWAY_VOLUME_MOUNT_PATH"
          else
            echo "ERROR: app/__init__.py no contiene RAILWAY_VOLUME_MOUNT_PATH"
            exit 1
          fi

          if grep -q "DATA_DIR" app/__init__.py; then
            echo "OK: DATA_DIR configurado"
          else
            echo "ERROR: DATA_DIR no está configurado"
            exit 1
          fi

          echo ""
          echo "PERSISTENCIA DEL REPOSITORIO: OK"

      # ==========================================================
      # GENERACIÓN DE RELEASE
      # ==========================================================

      - name: Crear release ZIP de ZAR 30.3.1
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          set -e

          RELEASE_DIR="/tmp/zar-release"
          ZIP_PATH="/tmp/ZAR_v30_3_1.zip"

          echo "=============================================="
          echo " CREANDO ZAR v30.3.1"
          echo "=============================================="

          rm -rf "$RELEASE_DIR"
          rm -f "$ZIP_PATH"

          mkdir -p "$RELEASE_DIR"

          echo ""
          echo "Copiando código actual..."

          cp -a ./. "$RELEASE_DIR/"

          # ------------------------------------------------------
          # NUNCA incluir datos persistentes ni runtime
          # ------------------------------------------------------

          echo ""
          echo "Eliminando datos persistentes/runtime del paquete..."

          rm -rf \
            "$RELEASE_DIR/.git" \
            "$RELEASE_DIR/data" \
            "$RELEASE_DIR/users" \
            "$RELEASE_DIR/backups" \
            "$RELEASE_DIR/jobs" \
            "$RELEASE_DIR/audio_studio" \
            "$RELEASE_DIR/video_creator"

          # ------------------------------------------------------
          # Eliminar cachés Python
          # ------------------------------------------------------

          find "$RELEASE_DIR" \
            -type d \
            -name '__pycache__' \
            -prune \
            -exec rm -rf {} +

          # ------------------------------------------------------
          # Eliminar bases de datos, tokens y otros runtime
          # ------------------------------------------------------

          find "$RELEASE_DIR" -type f \
            \( \
              -name '*.pyc' \
              -o -name '*.pyo' \
              -o -name '*.sqlite3' \
              -o -name '*.sqlite' \
              -o -name '*.db' \
              -o -name 'google_token.json' \
              -o -name 'youtube_token.json' \
              -o -name 'oauth_pending.json' \
              -o -name '*.zip' \
            \) \
            -delete

          # ------------------------------------------------------
          # Actualizar versión
          # ------------------------------------------------------

          echo ""
          echo "Actualizando versión a 30.3.1..."

          printf '30.3.1\n' > "$RELEASE_DIR/VERSION"
          printf '30.3.1\n' > "$RELEASE_DIR/VERSION.txt"

          if [ -f "$RELEASE_DIR/app/VERSION.txt" ]; then
            printf '30.3.1\n' > "$RELEASE_DIR/app/VERSION.txt"
          fi

          # ------------------------------------------------------
          # Crear ZIP con los archivos directamente en la raíz
          # ------------------------------------------------------

          echo ""
          echo "Comprimiendo release..."

          cd "$RELEASE_DIR"

          zip -qr "$ZIP_PATH" .

          # ------------------------------------------------------
          # Validar ZIP
          # ------------------------------------------------------

          echo ""
          echo "=============================================="
          echo " VALIDANDO ZIP"
          echo "=============================================="

          unzip -tq "$ZIP_PATH"

          echo ""
          echo "Comprobando versión..."

          unzip -p "$ZIP_PATH" VERSION | tr -d '\r' | grep -qx "30.3.1"

          echo "OK: versión 30.3.1"

          # ------------------------------------------------------
          # Comprobar que NO hay datos persistentes
          # ------------------------------------------------------

          echo ""
          echo "Comprobando que el ZIP no contiene datos persistentes..."

          if unzip -l "$ZIP_PATH" | grep -E \
            '(^|/)(data|users|backups|jobs|audio_studio|video_creator)(/|$)|\.(sqlite3?|db)$|/(google_token|youtube_token|oauth_pending)\.json$'; then

            echo ""
            echo "ERROR: el ZIP contiene datos persistentes/runtime."
            echo "La release NO se publicará."
            exit 1
          fi

          echo "OK: no se han incluido datos persistentes."

          echo ""
          echo "=============================================="
          echo " RELEASE CREADA CORRECTAMENTE"
          echo "=============================================="

          ls -lh "$ZIP_PATH"

      - name: Publicar ZAR v30.3.1 como artifact
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZAR-v30.3.1-release
          path: /tmp/ZAR_v30_3_1.zip
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # ACTUALIZACIÓN NORMAL DESDE ZIP
      # ==========================================================

      - name: Comprobar ZIP
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún ZIP en la raíz del repositorio."
            exit 1
          fi

          echo "ZIP detectado: $ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Preparar extracción
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -e

          rm -rf /tmp/zar-extracted
          mkdir -p /tmp/zar-extracted

          unzip -q "$ZIP_FILE" -d /tmp/zar-extracted

          echo "ZIP extraído correctamente."

      - name: Detectar carpeta raíz del ZIP
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -e

          ROOT="/tmp/zar-extracted"

          DIRECTORY_COUNT="$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          FILE_COUNT="$(find "$ROOT" -mindepth 1 -maxdepth 1 -type f | wc -l)"

          if [ "$DIRECTORY_COUNT" = "1" ] && [ "$FILE_COUNT" = "0" ]; then
            SOURCE_DIR="$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          else
            SOURCE_DIR="$ROOT"
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Raíz detectada: $SOURCE_DIR"

      - name: Auditar estado runtime del ZIP
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -e

          echo "=== AUDITORÍA DEL ZIP ==="

          PROTECTED_DIRS=(
            "data"
            "users"
            "backups"
            "jobs"
            "audio_studio"
            "video_creator"
          )

          for item in "${PROTECTED_DIRS[@]}"; do
            if [ -e "$SOURCE_DIR/$item" ]; then
              echo "ADVERTENCIA: el ZIP contiene estado runtime: $item"
            else
              echo "OK: $item no está dentro del ZIP"
            fi
          done

          echo ""
          echo "=== ARCHIVOS SENSIBLES ==="

          find "$SOURCE_DIR" -type f \( \
            -name '*.sqlite3' -o \
            -name '*.sqlite' -o \
            -name '*.db' -o \
            -name 'google_token.json' -o \
            -name 'youtube_token.json' -o \
            -name 'oauth_pending.json' \
          \) -print

          echo ""
          echo "Auditoría completada."

      - name: Modo seguro - finalizar sin modificar repositorio
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo " ZAR DRY-RUN COMPLETADO"
          echo "=============================================="
          echo ""
          echo "No se ha modificado el repositorio."
          echo "No se ha eliminado ningún archivo."
          echo "No se ha realizado ningún git push."
          echo ""
          echo "La protección de persistencia está activa."
          echo ""
          echo "El release ZIP se ha generado como artifact."
          echo ""

      # ==========================================================
      # PROTECCIÓN DURANTE UNA ACTUALIZACIÓN REAL
      # ==========================================================

      - name: Guardar workflow permanente
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/zar-protect

          cp ".github/workflows/zar-auto-update.yml" \
             "/tmp/zar-protect/zar-auto-update.yml"

      - name: Proteger datos persistentes
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -e

          PROTECTED_DIRS=(
            "data"
            "users"
            "backups"
            "jobs"
            "audio_studio"
            "video_creator"
          )

          for item in "${PROTECTED_DIRS[@]}"; do
            if [ -e "$SOURCE_DIR/$item" ]; then
              echo "Eliminando estado runtime del ZIP: $SOURCE_DIR/$item"
              rm -rf "$SOURCE_DIR/$item"
            fi
          done

          find "$SOURCE_DIR" -type f \( \
            -name '*.sqlite3' -o \
            -name '*.sqlite' -o \
            -name '*.db' -o \
            -name 'google_token.json' -o \
            -name 'youtube_token.json' -o \
            -name 'oauth_pending.json' \
          \) -print -delete

      - name: Reemplazar contenido del repositorio
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -e

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          cp -a "$SOURCE_DIR"/. .

          # El ZIP utilizado para actualizar nunca queda almacenado
          # dentro del repositorio.
          find . -type f -name '*.zip' -delete

          # Restaurar el workflow permanente.
          rm -rf .github
          mkdir -p .github/workflows

          cp "/tmp/zar-protect/zar-auto-update.yml" \
             ".github/workflows/zar-auto-update.yml"

          # Limpieza final.
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          find . -type f -name '.DS_Store' -delete

      - name: Verificar resultado
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -e

          if [ ! -f ".github/workflows/zar-auto-update.yml" ]; then
            echo "ERROR: se perdió el workflow permanente."
            exit 1
          fi

          for item in data users backups jobs audio_studio video_creator; do
            if [ -e "$item" ]; then
              echo "ERROR: estado runtime dentro del repositorio: $item"
              exit 1
            fi
          done

          echo "OK: código separado del estado persistente."

      - name: Commit y actualizar main
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi

          git commit -m "[zar-auto-update] Actualizar ZAR desde ZIP"

          git push
