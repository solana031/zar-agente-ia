name: ZAR - Actualizar desde ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Extraer ZIP y actualizar repositorio
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[zar-auto-update]') }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún ZIP en la raíz del repositorio."
            exit 1
          fi

          echo "ZIP detectado: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Guardar el workflow permanente
        shell: bash
        run: |
          set -e

          WORKFLOW=".github/workflows/zar-auto-update.yml"

          if [ ! -f "$WORKFLOW" ]; then
            echo "ERROR: Falta el workflow permanente: $WORKFLOW"
            exit 1
          fi

          mkdir -p /tmp/zar-protect
          cp "$WORKFLOW" /tmp/zar-protect/zar-auto-update.yml

      - name: Extraer ZIP
        shell: bash
        run: |
          set -e

          rm -rf /tmp/zar-extracted
          mkdir -p /tmp/zar-extracted

          unzip -q "$ZIP_FILE" -d /tmp/zar-extracted

          echo "ZIP extraído correctamente."

      - name: Detectar carpeta raíz del ZIP
        shell: bash
        run: |
          set -e

          ROOT="/tmp/zar-extracted"

          DIRECTORIES=("$ROOT"/*/)
          FILES=("$ROOT"/*)

          if [ ${#DIRECTORIES[@]} -eq 1 ] && [ ${#FILES[@]} -eq 1 ]; then
            SOURCE_DIR="${DIRECTORIES[0]%/}"
          else
            SOURCE_DIR="$ROOT"
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Contenido usado como raíz de ZAR: $SOURCE_DIR"

      - name: Proteger datos persistentes de ZAR
        shell: bash
        run: |
          set -e

          # El estado de ZAR vive en el Volume de Railway (/data).
          # Nunca debe formar parte de una release de código.

          PROTECTED_DIRS=(
            "data"
            "users"
            "backups"
            "jobs"
            "audio_studio"
            "video_creator"
          )

          for item in "${PROTECTED_DIRS[@]}"; do
            if [ -e "$SOURCE_DIR/$item" ]; then
              echo "Eliminando estado runtime del ZIP: $SOURCE_DIR/$item"
              rm -rf "$SOURCE_DIR/$item"
            fi
          done

          # Bases de datos, tokens y estado runtime nunca entran en una release.
          find "$SOURCE_DIR" -type f \( \
            -name '*.sqlite3' -o \
            -name '*.sqlite' -o \
            -name '*.db' -o \
            -name 'google_token.json' -o \
            -name 'youtube_token.json' -o \
            -name 'oauth_pending.json' \
          \) -print -delete

          echo "Protección de datos persistentes completada."

      - name: Reemplazar el contenido del repositorio
        shell: bash
        run: |
          set -e

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          cp -a "$SOURCE_DIR"/. .

          find . -type f -name '*.zip' -delete

          # El workflow permanente siempre se conserva.
          rm -rf .github
          mkdir -p .github/workflows
          cp /tmp/zar-protect/zar-auto-update.yml .github/workflows/zar-auto-update.yml

          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          find . -type f -name '.DS_Store' -delete

      - name: Verificar resultado
        shell: bash
        run: |
          set -e

          if [ ! -f "requirements.txt" ]; then
            echo "WARNING: No existe requirements.txt"
          fi

          if [ ! -d "app" ]; then
            echo "WARNING: No existe la carpeta app/"
          fi

          if [ ! -f ".github/workflows/zar-auto-update.yml" ]; then
            echo "ERROR: Se perdió el workflow permanente."
            exit 1
          fi

          for item in data users backups jobs audio_studio video_creator; do
            if [ -e "$item" ]; then
              echo "ERROR: El estado runtime quedó dentro del repositorio: $item"
              exit 1
            fi
          done

          echo "OK: el almacenamiento runtime permanece fuera del repositorio."

      - name: Commit y actualizar main
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi

          git commit -m "[zar-auto-update] Actualizar ZAR desde ZIP"
          git push
