# Install unchanged in solana031/solana031.github.io/.github/workflows/.
# Railway remains production. This job can only deploy the derived Pages mirror.
name: ReposNews mirror
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: reposnews-mirror
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: https://solana031.github.io/
    steps:
      - name: Read existing static backup repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: mirror
      - name: Read approved builder from ZAR main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: solana031/zar-agente-ia
          path: builder
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/
      - name: Build only primary PUBLISHED snapshots
        id: build
        env:
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FORCE_SYNC" = "true" ]; then
            python3 builder/tools/reposnews_mirror_sync.py prepare --force
          else
            python3 builder/tools/reposnews_mirror_sync.py prepare
          fi
      - name: Configure existing Pages
        if: steps.build.outputs.changed == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload public noindex mirror
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/reposnews
      - name: Deploy mirror only
        if: steps.build.outputs.changed == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed artifact and every asset
        if: steps.build.outputs.changed == 'true'
        run: python3 builder/tools/reposnews_mirror_sync.py verify
      - name: Preserve verified navigable backup revision
        if: steps.build.outputs.changed == 'true'
        run: |
          test -d mirror/.git && test -f dist/reposnews/build-manifest.json
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='CNAME' dist/reposnews/ mirror/
          touch mirror/.nojekyll
          git -C mirror config user.name 'github-actions[bot]'
          git -C mirror config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C mirror add --all
          if ! git -C mirror diff --cached --quiet; then
            git -C mirror commit -m 'Sync verified ReposNews mirror from primary PUBLISHED snapshots'
            git -C mirror push origin HEAD:main
          fi
